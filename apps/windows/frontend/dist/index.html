    <title>CHIMERA</title>
    <script type="module" crossorigin src="/assets/index-yl0KFIX4.js"></script>
    <link rel="stylesheet" crossorigin href="/assets/index-BgRnMg3P.css">
  </head>
  <body>

          <stop offset="0" stop-color="#F0955B" />
          <stop offset="0.55" stop-color="#DC7A44" />
          <stop offset="1" stop-color="#B45F28" />
        </linearGradient>
        <symbol id="i-mark" viewBox="0 0 48 48">
          <path d="M24 3.2 41.5 13v22L24 44.8 6.5 35V13L24 3.2Z" fill="url(#copper)" />
          <path d="M24 9.4 35.4 15.8v16.4L24 38.6 12.6 32.2V15.8L24 9.4Z" fill="#160D08" fill-opacity="0.55" />
          <path d="M15.5 17.2h17M15.5 22h11.4M15.5 26.8h6.4" stroke="#F6D9BF" stroke-width="2.6" stroke-linecap="round" />
        </symbol>
        <symbol id="i-power" viewBox="0 0 24 24">
          <path d="M12 3v9" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" />
          <path d="M6.2 6.5a8 8 0 1 0 11.6 0" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" />
        </symbol>
        <symbol id="i-tray" viewBox="0 0 24 24">
          <rect x="3" y="4.5" width="18" height="15" rx="2.5" fill="none" stroke="currentColor" stroke-width="1.8" />
          <path d="M3 13.5h18" fill="none" stroke="currentColor" stroke-width="1.8" />
          <circle cx="12" cy="17" r="1.2" fill="currentColor" />
        </symbol>
        <symbol id="i-link" viewBox="0 0 24 24">
          <path d="M10.5 13.5a4 4 0 0 0 5.7 0l3-3a4 4 0 0 0-5.7-5.7l-1.4 1.4" fill="none" stroke="currentColor" stroke-width="1.9" stroke-linecap="round" />
          <path d="M13.5 10.5a4 4 0 0 0-5.7 0l-3 3a4 4 0 0 0 5.7 5.7l1.4-1.4" fill="none" stroke="currentColor" stroke-width="1.9" stroke-linecap="round" />
        </symbol>
        <symbol id="i-import" viewBox="0 0 24 24">
          <path d="M12 3v10m0 0 4-4m-4 4-4-4" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" />
          <path d="M4 17v2a2 2 0 0 0 2 2h12a2 2 0 0 0 2-2v-2" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" />
        </symbol>
        <symbol id="i-copy" viewBox="0 0 24 24">
          <rect x="8" y="8" width="12" height="12" rx="2" fill="none" stroke="currentColor" stroke-width="1.9" />
          <path d="M16 8V6a2 2 0 0 0-2-2H6a2 2 0 0 0-2 2v8a2 2 0 0 0 2 2h2" fill="none" stroke="currentColor" stroke-width="1.9" stroke-linecap="round" />
        </symbol>
        <symbol id="i-up" viewBox="0 0 24 24">
          <path d="M12 19V5m0 0-5 5m5-5 5 5" fill="none" stroke="currentColor" stroke-width="2.1" stroke-linecap="round" stroke-linejoin="round" />
        </symbol>
        <symbol id="i-down" viewBox="0 0 24 24">
          <path d="M12 5v14m0 0 5-5m-5 5-5-5" fill="none" stroke="currentColor" stroke-width="2.1" stroke-linecap="round" stroke-linejoin="round" />
        </symbol>
        <symbol id="i-eye" viewBox="0 0 24 24">
          <path d="M2.5 12S6 5.5 12 5.5 21.5 12 21.5 12 18 18.5 12 18.5 2.5 12 2.5 12Z" fill="none" stroke="currentColor" stroke-width="1.9" stroke-linejoin="round" />
          <circle cx="12" cy="12" r="2.8" fill="none" stroke="currentColor" stroke-width="1.9" />
        </symbol>
        <symbol id="i-eye-off" viewBox="0 0 24 24">
          <path d="M4 4l16 16" fill="none" stroke="currentColor" stroke-width="1.9" stroke-linecap="round" />
          <path d="M10 10.6a2.8 2.8 0 0 0 3.4 3.4M5.3 7.3A13 13 0 0 0 2.5 12S6 18.5 12 18.5a12 12 0 0 0 3.5-.6M10.5 5.9A12 12 0 0 1 12 5.5c6 0 9.5 6.5 9.5 6.5a13 13 0 0 1-2.6 3.6" fill="none" stroke="currentColor" stroke-width="1.9" stroke-linecap="round" stroke-linejoin="round" />
        </symbol>
        <symbol id="i-chevron" viewBox="0 0 24 24">
          <path d="m7 9.5 5 5 5-5" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" />
        </symbol>
        <symbol id="i-server" viewBox="0 0 24 24">
          <rect x="4" y="4" width="16" height="6.5" rx="1.8" fill="none" stroke="currentColor" stroke-width="1.8" />
          <rect x="4" y="13.5" width="16" height="6.5" rx="1.8" fill="none" stroke="currentColor" stroke-width="1.8" />
          <path d="M8 7.25h.01M8 16.75h.01" stroke="currentColor" stroke-width="2.6" stroke-linecap="round" />
        </symbol>
        <symbol id="i-trash" viewBox="0 0 24 24">
          <path d="M4 7h16M10 11v5m4-5v5M6 7l1 13h10l1-13M9 7V4h6v3" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round" />
        </symbol>
        <symbol id="i-erase" viewBox="0 0 24 24">
          <path d="m4 17 9-9a2 2 0 0 1 2.8 0l3.2 3.2a2 2 0 0 1 0 2.8L12 21H6.5L4 17Z" fill="none" stroke="currentColor" stroke-width="1.9" stroke-linejoin="round" />
          <path d="m6 13 5-5M20 21h-5" fill="none" stroke="currentColor" stroke-width="1.9" stroke-linecap="round" />
        </symbol>
        <symbol id="i-save" viewBox="0 0 24 24">
          <path d="M5 4h11l3 3v13H5V4Z" fill="none" stroke="currentColor" stroke-width="1.9" stroke-linejoin="round" />
          <path d="M8 4v5h8V4M8 20v-6h8v6" fill="none" stroke="currentColor" stroke-width="1.9" stroke-linejoin="round" />

        <symbol id="i-check" viewBox="0 0 24 24">
          <path d="m5 12.5 4.5 4.5L19 7" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round" />
        </symbol>
      </defs>
    </svg>

    <div id="app">
      <header class="topbar">
        <div class="brand">
          <svg class="mark" viewBox="0 0 48 48" aria-hidden="true"><use href="#i-mark" /></svg>
          <div class="brand-copy">
            <h1>CHIMERA</h1>
            <p>协议基因客户端 · 关窗留在托盘</p>
          </div>
        </div>
        <div class="top-actions">
          <div id="statusBadge" class="badge disconnected" role="status" aria-live="polite" title="未连接">
            <span class="dot" aria-hidden="true"></span>
            <span id="statusText">未连接</span>
          </div>
          <button id="trayBtn" class="ghost icon-text" type="button" aria-label="隐藏到系统托盘">
            <svg class="ico" aria-hidden="true"><use href="#i-tray" /></svg>
            <span>托盘</span>
          </button>
        </div>
      </header>

      <main>
        <section class="card invite-card" aria-label="邀请">
          <div class="section-title">
            <span class="section-icon" aria-hidden="true"><svg class="ico"><use href="#i-link" /></svg></span>
            <div>
              <h2>邀请链接</h2>
              <p>链接就是密钥。发给另一台设备即可，不必再手填 Seed / PSK。</p>
            </div>
          </div>
          <div class="invite-row">
            <input
              id="inviteInput"
              type="text"
              spellcheck="false"
              autocomplete="off"
              placeholder="粘贴 chimera://v1/… 或整份 client.json"
              aria-label="邀请链接"
            />
            <button id="importBtn" class="soft" type="button">
              <svg class="ico" aria-hidden="true"><use href="#i-import" /></svg>
              <span>导入</span>
            </button>
            <button id="copyInviteBtn" class="ghost" type="button">
              <svg class="ico" aria-hidden="true"><use href="#i-copy" /></svg>
              <span>复制</span>
            </button>
          </div>
        </section>

        <button id="connectBtn" class="connect" type="button" data-state="disconnected">
          <svg class="ico" aria-hidden="true"><use href="#i-power" /></svg>
          <span id="connectLabel">连接</span>
        </button>

        <section class="card stats" aria-label="流量">
          <div class="stat">
            <span class="stat-ico up" aria-hidden="true"><svg class="ico"><use href="#i-up" /></svg></span>
            <div>
              <span class="stats-label">上行</span>
              <strong id="txTotal">0 B</strong>
              <span id="txRate" class="rate">0 B/s</span>
            </div>
          </div>
          <div class="stat">
            <span class="stat-ico down" aria-hidden="true"><svg class="ico"><use href="#i-down" /></svg></span>
            <div>
              <span class="stats-label">下行</span>
              <strong id="rxTotal">0 B</strong>
              <span id="rxRate" class="rate">0 B/s</span>
            </div>
          </div>
          <div class="spark-wrap">
            <canvas id="spark" width="640" height="56" aria-hidden="true"></canvas>
            <span class="spark-note">最近 60 秒 · 上下行合计</span>
          </div>
        </section>

        <details class="card advanced">
          <summary>
            <svg class="ico chev" aria-hidden="true"><use href="#i-chevron" /></svg>
            <span>手动填写</span>
          </summary>
          <div class="form-grid">
            <label class="field">
              <span>服务器</span>
              <input id="serverAddr" type="text" placeholder="host:port" autocomplete="off" />
            </label>
            <label class="field">
              <span>名称（可选）</span>
              <input id="serverName" type="text" placeholder="家里的 VPS" autocomplete="off" />
            </label>
            <label class="field field-wide">
              <span>Seed</span>
              <div class="secret-row">
                <input id="seedHex" type="password" placeholder="64 位十六进制" autocomplete="off" />
                <button type="button" class="secret-toggle" data-toggle="seedHex" aria-pressed="false">
                  <svg class="ico eye" aria-hidden="true"><use href="#i-eye" /></svg>
                  <span>显示</span>
                </button>
              </div>
            </label>
            <label class="field">
              <span>Generation</span>
              <input id="generation" type="number" min="0" step="1" value="0" inputmode="numeric" />
            </label>
            <label class="field">
              <span>传输</span>
              <input id="transportInput" type="text" value="udp" spellcheck="false" autocomplete="off" placeholder="udp / tcp / websocket / wss" />
            </label>
            <label class="field">
              <span>端口跳跃数（1 = 关闭）</span>
              <input id="portHopCount" type="number" min="1" max="16" step="1" value="1" inputmode="numeric" />
            </label>
            <label class="field">
              <span>跳跃偏移范围（0 = 默认 2048）</span>
              <input id="portHopSpread" type="number" min="0" max="60000" step="1" value="0" inputmode="numeric" />
            </label>
            <label class="field field-wide check-field">
              <input id="splitTunnel" type="checkbox" checked />
              <span class="check-copy">
                <strong>分流：局域网 / 私网直连</strong>
                <small>只有公网流量走隧道；家庭网络、打印机、服务器地址保持直连。</small>
              </span>
            </label>
            <label class="field field-wide">
              <span>PSK</span>
              <div class="secret-row">
                <input id="pskHex" type="password" placeholder="64 位十六进制" autocomplete="off" />
                <button type="button" class="secret-toggle" data-toggle="pskHex" aria-pressed="false">
                  <svg class="ico eye" aria-hidden="true"><use href="#i-eye" /></svg>
                  <span>显示</span>
                </button>
              </div>
            </label>
          </div>
          <div class="actions">
            <button id="saveServerBtn" class="ghost" type="button">
              <svg class="ico" aria-hidden="true"><use href="#i-save" /></svg>
              <span>保存入口</span>
            </button>
          </div>
        </details>

        <section class="card nodes-card" aria-label="已保存的入口">
          <div class="section-head">
            <div class="section-title">
              <span class="section-icon" aria-hidden="true"><svg class="ico"><use href="#i-server" /></svg></span>
              <div>
                <h2>入口</h2>
                <p>只记 host:port。协议密钥跟邀请走。</p>
              </div>
            </div>
          </div>
          <div id="serverList" class="server-list">
            <div class="empty">还没有保存的入口。连上一次，或点「保存入口」。</div>
          </div>
        </section>

        <section class="card logs-card" aria-label="日志">
          <div class="section-head">
            <div class="section-title">
              <h2>日志</h2>
              <p>连接过程与异常会显示在这里。</p>
            </div>
            <button id="clearLogsBtn" class="ghost icon-text small" type="button">
              <svg class="ico" aria-hidden="true"><use href="#i-erase" /></svg>
              <span>清空</span>
            </button>
          </div>
          <div id="logs" class="logs" aria-live="polite">
            <div class="log muted">粘贴邀请链接，或展开手动填写。</div>
          </div>
        </section>
      </main>

      <footer>
        <svg class="ico" aria-hidden="true"><use href="#i-check" /></svg>
        <span>配置仅保存在本机。密钥不会写入日志或回传。</span>
      </footer>
    </div>

  </body>
</html>
